# Localisation codegen config (English / Russian / Uzbek).
# Generates AppLocalizations into lib/l10n (no synthetic package) so it imports
# like any normal file: package:edugain/l10n/app_localizations.dart
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n
nullable-getter: false

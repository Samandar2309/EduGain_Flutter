<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EduGain — practice English with an AI speaking coach.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Telegram Mini App SDK — a no-op outside Telegram, so the same build
       works standalone too. Loaded before Flutter's own bootstrap so
       `window.Telegram.WebApp` exists by the time Dart code checks for it. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Refuse fullscreen HERE, not in Dart.
    //
    // Telegram remembers the mode a Mini App was last opened in and re-applies
    // it the instant the WebView appears. Dart cannot answer that in time: it
    // runs after the Flutter engine has downloaded and booted, which is
    // seconds — and those seconds are the whole complaint. The app opened with
    // no Telegram header, its close button over the greeting, and only then
    // snapped back to a window.
    //
    // This runs on the line after the SDK is defined, before Flutter is even
    // fetched, so there is no window in which the app is fullscreen.
    (function () {
      var app = window.Telegram && window.Telegram.WebApp;
      if (!app || typeof app.exitFullscreen !== 'function') return;
      // Unconditional: asking to leave a mode we are not in costs nothing,
      // and `isFullscreen` is not reliably populated this early — reading it
      // was exactly what let the mode through.
      var off = function () { try { app.exitFullscreen(); } catch (e) {} };
      off();
      // Telegram can grant the remembered mode a beat after the WebView opens,
      // and not every client fires `fullscreenChanged` when it does. A few
      // repeats over the first moments cover that; they stop on their own.
      [60, 150, 300, 600, 1200, 2000].forEach(function (ms) {
        setTimeout(off, ms);
      });
      try { app.onEvent('fullscreenChanged', off); } catch (e) {}
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="edugain">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>edugain</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Measures the device's unsafe strips, so Flutter can read them.
       `viewport-fit=cover` above is what makes env() report anything at all;
       without it these are always zero. Hidden and zero-sized — it exists to
       be measured, not seen. */
    #eg-safe-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      visibility: hidden;
      pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
  </style>
  <script>
    // The safe area, in CSS pixels, or null when the probe is missing.
    //
    // Read from a real element rather than the custom property, because
    // env() inside a variable comes back as the literal text; resolved
    // padding is a number.
    //
    // This is the source that works on EVERY Telegram client. The Bot API
    // only started reporting insets in 8.0, and the phones that need this
    // most are the ones least likely to be on it.
    window.edugainSafeArea = function () {
      var el = document.getElementById('eg-safe-probe');
      if (!el) return null;
      var s = getComputedStyle(el);
      return {
        top: parseFloat(s.paddingTop) || 0,
        bottom: parseFloat(s.paddingBottom) || 0,
        left: parseFloat(s.paddingLeft) || 0,
        right: parseFloat(s.paddingRight) || 0
      };
    };
  </script>
</head>
<body>
  <div id="eg-safe-probe"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
